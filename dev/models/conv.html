<!doctype html><html><body style="margin:0"><canvas id=c width=1100 height=620></canvas>
<script src="lib/three.min.js"></script><script src="lib/fflate.min.js"></script><script src="lib/NURBSUtils.js"></script><script src="lib/NURBSCurve.js"></script><script src="lib/FBXLoader.js"></script><script src="lib/GLTFExporter.js"></script><script src="lib/BufferGeometryUtils.js"></script><script src="lib/meshopt_simplifier.js"></script><script src="lib/OBJLoader.js"></script>
<script>
const R=new THREE.WebGLRenderer({canvas:c,antialias:true,preserveDrawingBuffer:true});R.outputEncoding=THREE.sRGBEncoding;const sc=new THREE.Scene();sc.background=new THREE.Color(0x1a2030);
sc.add(new THREE.HemisphereLight(0xdfe8ff,0x303040,.8));const L=new THREE.DirectionalLight(0xffffff,1.6);L.position.set(-3,5,-4);sc.add(L);
const tex=new THREE.TextureLoader().load(location.search.length>1?location.search.slice(1)+'_tex.jpg':'flyer2k.jpg');tex.encoding=THREE.sRGBEncoding;
window.load=(url)=>new Promise((res,rej)=>{url=url||'ship.fbx';const done=o=>{o.updateMatrixWorld(true);const gs=[],info=[];o.traverse(q=>{if(q.isMesh){let g=q.geometry.clone();g.applyMatrix4(q.matrixWorld);const keep={position:g.attributes.position,uv:g.attributes.uv||new THREE.Float32BufferAttribute(new Float32Array(g.attributes.position.count*2),2)};const h=new THREE.BufferGeometry();h.setAttribute('position',keep.position);h.setAttribute('uv',keep.uv);if(g.index)h.setIndex(g.index);gs.push(h.index?h.toNonIndexed():h);const ms=Array.isArray(q.material)?q.material:[q.material];info.push([q.name,(g.index?g.index.count:g.attributes.position.count)/3,ms.map(m=>m.name+':'+(m.map?'map':'-'))])}});
 const G=gs.length>1?THREE.BufferGeometryUtils.mergeBufferGeometries(gs):gs[0];window.SRC={geometry:G};G.computeBoundingBox();res(JSON.stringify({info:info.slice(0,12),n:info.length,tri:G.attributes.position.count/3,bb:G.boundingBox}))};
 if(/\.obj$/.test(url))new THREE.OBJLoader().load(url,done,null,e=>rej(String(e)));else if(/\.glb$/.test(url)){const s=document.createElement('script');s.src='tmp_gltf.js';s.onload=()=>new THREE.GLTFLoader().load(url,g=>done(g.scene),null,e=>rej(String(e)));document.head.appendChild(s)}else new THREE.FBXLoader().load(url,done,null,e=>rej(String(e)))});
window.mirrorX=()=>{const g=SRC.geometry,p=g.attributes.position.array,u=g.attributes.uv.array,n=p.length/3;const P=new Float32Array(n*6),U=new Float32Array(n*4);P.set(p);U.set(u);
 for(let t=0;t<n/3;t++)for(let k=0;k<3;k++){const src=t*3+(k==0?0:k==1?2:1),dst=n+t*3+k;P[dst*3]=-p[src*3];P[dst*3+1]=p[src*3+1];P[dst*3+2]=p[src*3+2];U[dst*2]=u[src*2];U[dst*2+1]=u[src*2+1]}
 const G=new THREE.BufferGeometry();G.setAttribute('position',new THREE.BufferAttribute(P,3));G.setAttribute('uv',new THREE.BufferAttribute(U,2));SRC.geometry=G;return n*2/3};
window.simp=async(target,err,flags)=>{if(target>=SRC.geometry.attributes.position.count/3){const g=THREE.BufferGeometryUtils.mergeVertices(SRC.geometry,1e-5);window.OUT=g;return 'sans simplification '+g.index.count/3}await MeshoptSimplifier.ready;const g0=SRC.geometry.clone();g0.deleteAttribute('normal');let g=THREE.BufferGeometryUtils.mergeVertices(g0,1e-5);
 const pos=g.attributes.position.array,uv=g.attributes.uv.array,n=pos.length/3;const idx=new Uint32Array(g.index.array);
 const attr=new Float32Array(n*2);for(let i=0;i<n*2;i++)attr[i]=uv[i];
 const t0=performance.now();const [ni,e]=MeshoptSimplifier.simplifyWithAttributes(idx,pos,3,attr,2,[.5,.5],null,Math.floor(target)*3,err,flags);
 const used=new Int32Array(n).fill(-1);let k=0;const P=[],U=[];const I=new Uint32Array(ni.length);for(let i=0;i<ni.length;i++){const v=ni[i];if(used[v]<0){used[v]=k++;P.push(pos[v*3],pos[v*3+1],pos[v*3+2]);U.push(uv[v*2],uv[v*2+1])}I[i]=used[v]}
 const G=new THREE.BufferGeometry();G.setAttribute('position',new THREE.Float32BufferAttribute(P,3));G.setAttribute('uv',new THREE.Float32BufferAttribute(U,2));G.setIndex(new THREE.BufferAttribute(I,1));G.computeVertexNormals();
 window.OUT=G;return JSON.stringify({merged:n,tri:ni.length/3,verts:k,err:e,ms:Math.round(performance.now()-t0)})};
window.show=(which,yaw,pitch)=>{while(sc.children.length>2)sc.remove(sc.children[2]);const geo=which=='src'?SRC.geometry:OUT;const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({map:tex,roughness:.45,metalness:.45}));
 geo.computeBoundingBox();const b=geo.boundingBox,ctr=b.getCenter(new THREE.Vector3()),sz=b.getSize(new THREE.Vector3()).length();m.position.copy(ctr).multiplyScalar(-1);const g=new THREE.Group();g.add(m);g.rotation.set(pitch||0,yaw||0,0);sc.add(g);
 const cam=new THREE.PerspectiveCamera(35,1100/620,sz*.01,sz*10);cam.position.set(0,sz*.25,-sz*1.5);cam.lookAt(0,0,0);R.render(sc,cam);return c.toDataURL('image/png')};
window.crease=(deg)=>{const g=OUT.toNonIndexed();const p=g.attributes.position.array,nt=p.length/9,fn=new Float32Array(nt*3),A=new THREE.Vector3(),B=new THREE.Vector3(),C=new THREE.Vector3();
 for(let t=0;t<nt;t++){A.fromArray(p,t*9);B.fromArray(p,t*9+3);C.fromArray(p,t*9+6);B.sub(A);C.sub(A);B.cross(C);fn[t*3]=B.x;fn[t*3+1]=B.y;fn[t*3+2]=B.z}
 const key=i=>Math.round(p[i*3]*1e3)+','+Math.round(p[i*3+1]*1e3)+','+Math.round(p[i*3+2]*1e3),M=new Map();for(let i=0;i<nt*3;i++){const k=key(i);let L=M.get(k);if(!L)M.set(k,L=[]);L.push(i)}
 const N=new Float32Array(nt*9),cs=Math.cos(deg*Math.PI/180),f=new THREE.Vector3(),q=new THREE.Vector3(),s=new THREE.Vector3();
 for(const L of M.values())for(const i of L){const t=(i/3)|0;f.fromArray(fn,t*3).normalize();s.set(0,0,0);for(const j of L){const u=(j/3)|0;q.fromArray(fn,u*3);const l=q.length();if(l>0&&q.dot(f)/l>=cs)s.add(q)}if(s.lengthSq()==0)s.copy(f);s.normalize();N[i*3]=s.x;N[i*3+1]=s.y;N[i*3+2]=s.z}
 g.setAttribute('normal',new THREE.BufferAttribute(N,3));const m=THREE.BufferGeometryUtils.mergeVertices(g,1e-4);OUT=m;return JSON.stringify({verts:m.attributes.position.count,tri:m.index.count/3})};
window.exportGLB=()=>new Promise(res=>{const G=OUT.clone();G.computeBoundingBox();const b=G.boundingBox,ctr=b.getCenter(new THREE.Vector3());G.translate(-ctr.x,-ctr.y,-ctr.z);
 const m=new THREE.Mesh(G,new THREE.MeshStandardMaterial({color:0xffffff}));m.name='flyer';new THREE.GLTFExporter().parse(m,r=>{const u8=new Uint8Array(r);let s='';for(let i=0;i<u8.length;i+=32768)s+=String.fromCharCode.apply(null,u8.subarray(i,i+32768));res(btoa(s))},{binary:true})});
</script></body></html>
